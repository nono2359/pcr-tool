name: Release Japanese APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Create private configuration
        run: |
          mkdir -p app/src/main/java/cn/wthee/pcrtool/utils
          printf '%s\n' 'package cn.wthee.pcrtool.utils' '' 'object PrivateConfig {' '    const val BUGLY_KEY = ""' '}' > app/src/main/java/cn/wthee/pcrtool/utils/PrivateConfig.kt

      - name: Restore release keystore
        env:
          PCR_RELEASE_KEYSTORE_BASE64: ${{ secrets.PCR_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$PCR_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pcr-release.jks"

      - name: Build signed release APK
        env:
          PCR_RELEASE_STORE_FILE: ${{ runner.temp }}/pcr-release.jks
          PCR_RELEASE_STORE_PASSWORD: ${{ secrets.PCR_RELEASE_STORE_PASSWORD }}
          PCR_RELEASE_KEY_ALIAS: ${{ secrets.PCR_RELEASE_KEY_ALIAS }}
          PCR_RELEASE_KEY_PASSWORD: ${{ secrets.PCR_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleOfficialRelease --no-daemon --no-problems-report --max-workers=2

      - name: Prepare release asset
        run: cp app/build/outputs/apk/official/release/app-official-release.apk app-official-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" app-official-release.apk --generate-notes --verify-tag
